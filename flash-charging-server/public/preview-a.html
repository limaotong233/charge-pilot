<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案A - 极简白</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#fafafa;color:#1a1a1a;font-size:14px;line-height:1.6}

/* 顶栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:60px;background:#fff;border-bottom:1px solid #f0f0f0}
.topbar h1{font-size:17px;font-weight:600;letter-spacing:-0.3px;color:#1a1a1a}
.topbar-right{display:flex;align-items:center;gap:20px;font-size:13px;color:#888}

/* 布局 */
.layout{display:flex;height:calc(100vh - 60px)}
.nav{width:220px;background:#fff;border-right:1px solid #f0f0f0;padding:16px 0;flex-shrink:0}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 24px;color:#666;text-decoration:none;font-size:13.5px;transition:all .15s;border-left:3px solid transparent}
.nav a:hover{color:#1a1a1a;background:#fafafa}
.nav a.active{color:#1a1a1a;font-weight:500;background:#f5f5f5;border-left-color:#1a1a1a}
.main{flex:1;padding:28px 32px;overflow-y:auto}

/* 统计卡片 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.card{background:#fff;border-radius:10px;padding:22px 24px;border:1px solid #f0f0f0}
.card .label{font-size:12.5px;color:#999;margin-bottom:8px;font-weight:400}
.card .value{font-size:26px;font-weight:700;letter-spacing:-0.5px}
.card .sub{font-size:12px;color:#999;margin-top:4px}

/* 表格 */
.section-title{font-size:15px;font-weight:600;margin-bottom:16px;color:#1a1a1a}
.table-card{background:#fff;border-radius:10px;border:1px solid #f0f0f0;overflow:hidden}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #f5f5f5}
.search{display:flex;gap:8px}
.search input{padding:7px 12px;border:1px solid #e8e8e8;border-radius:6px;font-size:13px;width:220px;outline:none;transition:border .15s}
.search input:focus{border-color:#aaa}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:11px 20px;font-size:12px;font-weight:500;color:#999;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid #f0f0f0;background:#fafafa}
td{padding:12px 20px;font-size:13px;border-bottom:1px solid #f8f8f8;color:#333}
tr:hover td{background:#fcfcfc}

/* 按钮 */
.btn{padding:6px 14px;border:1px solid #e0e0e0;border-radius:6px;background:#fff;cursor:pointer;font-size:12.5px;color:#555;transition:all .15s}
.btn:hover{border-color:#bbb;color:#333}
.btn-dark{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn-dark:hover{background:#333}
.btn-sm{padding:4px 10px;font-size:12px}

/* 标签 */
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11.5px;font-weight:500}
.tag-green{background:#f0f9f0;color:#2d7d2d}
.tag-amber{background:#fff8f0;color:#b36b00}
.tag-red{background:#fef0f0;color:#c53030}
.tag-gray{background:#f5f5f5;color:#888}

/* 分页 */
.pager{display:flex;justify-content:center;align-items:center;gap:12px;padding:16px;font-size:13px;color:#999}
</style>
</head>
<body>
<div class="topbar">
  <h1>闪充管理平台</h1>
  <div class="topbar-right"><span>admin</span><span style="cursor:pointer;color:#999">退出</span></div>
</div>
<div class="layout">
  <nav class="nav">
    <a href="#" class="active">概览</a>
    <a href="#">用户</a>
    <a href="#">充电站</a>
    <a href="#">订单</a>
    <a href="#">预约</a>
    <a href="#">代金券</a>
    <a href="#">收藏</a>
  </nav>
  <div class="main">
    <div class="stats">
      <div class="card"><div class="label">注册用户</div><div class="value">2</div></div>
      <div class="card"><div class="label">充电站</div><div class="value">11</div></div>
      <div class="card"><div class="label">完成订单</div><div class="value">0</div></div>
      <div class="card"><div class="label">总收入</div><div class="value">0.00</div><div class="sub">元</div></div>
    </div>

    <div class="section-title">订单</div>
    <div class="table-card">
      <div class="toolbar">
        <div class="search"><input placeholder="搜索订单号..."><button class="btn">搜索</button></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-sm">全部</button>
          <button class="btn btn-sm">进行中</button>
          <button class="btn btn-sm">待支付</button>
          <button class="btn btn-sm">已完成</button>
        </div>
      </div>
      <table>
        <thead><tr><th>订单号</th><th>充电站</th><th>电量</th><th>金额</th><th>状态</th><th>时间</th></tr></thead>
        <tbody>
          <tr><td>OC20260501A1B2</td><td>哈尔滨市道里区中央大街充电站</td><td>32.50 kWh</td><td>39.00</td><td><span class="tag tag-green">已完成</span></td><td>2026-05-01 14:30</td></tr>
          <tr><td>OC20260502C3D4</td><td>哈尔滨市南岗区哈工大充电站</td><td>18.20 kWh</td><td>27.30</td><td><span class="tag tag-amber">待支付</span></td><td>2026-05-02 09:15</td></tr>
          <tr><td>OC20260503E5F6</td><td>哈尔滨市松北区超级充电站</td><td>45.00 kWh</td><td>81.00</td><td><span class="tag tag-blue">进行中</span></td><td>2026-05-03 16:45</td></tr>
        </tbody>
      </table>
      <div class="pager"><button class="btn btn-sm" disabled>上一页</button><span>第 1 / 1 页</span><button class="btn btn-sm" disabled>下一页</button></div>
    </div>
  </div>
</div>
</body>
</html>
